<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>Anyon AI - Anonymous AI Assistant</title>
    <meta name="title" content="Anyon AI - Anonymous AI Assistant" />
    <meta name="description" content="A powerful and anonymous AI chat interface supporting multiple advanced language models." />
    <meta name="keywords" content="AI, Artificial Intelligence, Chatbot, LLM, Anonymous, GLM, DeepSeek, Nemotron" />
    <meta name="author" content="Anyon AI" />
    <meta name="theme-color" content="#4f46e5" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anon-ai.app/" />
    <meta property="og:title" content="Anyon AI - Anonymous AI Assistant" />
    <meta property="og:description" content="A powerful and anonymous AI chat interface supporting multiple advanced language models." />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://anon-ai.app/" />
    <meta property="twitter:title" content="Anyon AI - Anonymous AI Assistant" />
    <meta property="twitter:description" content="A powerful and anonymous AI chat interface supporting multiple advanced language models." />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <style>
      /* Initial loader styles */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
        color: #f8fafc;
        z-index: 9999;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .logo-container {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        animation: float 3s ease-in-out infinite;
      }
      .loader-text {
        font-size: 1.5rem;
        font-weight: 600;
        background: linear-gradient(135deg, #a5b4fc, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.5px;
      }
      .loader-spinner {
        margin-top: 20px;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(165, 180, 252, 0.2);
        border-radius: 50%;
        border-top-color: #a5b4fc;
        animation: spin 1s linear infinite;
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
        100% { transform: translateY(0px); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Anyon AI.</noscript>
    <div id="root">
      <!-- Loading state that shows before React mounts -->
      <div id="initial-loader">
        <div class="logo-container">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="url(#logo-gradient)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%">
            <defs>
              <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a5b4fc" />
                <stop offset="100%" stop-color="#c084fc" />
              </linearGradient>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="1" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>
            <g filter="url(#glow)">
              <path d="M9 10h.01" stroke-width="2.5"/>
              <path d="M15 10h.01" stroke-width="2.5"/>
              <path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/>
            </g>
          </svg>
        </div>
        <div class="loader-text">Anyon AI</div>
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
